[project]
name = "bonsai"
version = "0.0.1"
description = "盆栽のように少しずつ整える自律コーディングエージェント — CLI ランナー抽象 + Supervisor-Worker-Reviewer の 3 ロール協調"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "tori-create-7991" },
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.scripts]
bonsai = "bonsai.cli:main"

[project.urls]
Repository = "https://github.com/tori-create-7991/bonsaidev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/bonsai/cli.py" = ["B008"]  # typer.Argument/Option in defaults is intentional

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
